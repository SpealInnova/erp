<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña — SPEAL Project Control</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <main class="tarjeta">
    <h1 class="marca">SPEAL Project Control</h1>
    <p class="subtitulo">Escribe tu nueva contraseña.</p>

    <div id="alerta" class="alerta oculto" role="alert"></div>

    <form id="form-restablecer" novalidate>
      <div class="campo">
        <label for="nueva-password">Nueva contraseña</label>
        <input id="nueva-password" name="nuevaPassword" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="campo">
        <label for="confirmar-password">Confirmar contraseña</label>
        <input id="confirmar-password" name="confirmar" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button id="boton-restablecer" class="boton" type="submit">Guardar contraseña</button>
    </form>

    <a class="enlace" href="/login">Volver a iniciar sesión</a>
    <p class="texto-suave">La contraseña debe tener al menos 8 caracteres.</p>
  </main>

  <script src="/js/restablecer.js"></script>
</body>
</html>
