<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPEAL Project Control</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.css">
  <script src="/js/accesibilidad.js"></script>
</head>
<body class="app-body">
  <section id="panel-accesibilidad" class="acceso-panel oculto" aria-label="Opciones de accesibilidad">
    <label><input id="opcion-contraste" type="checkbox"> Alto contraste</label>
    <fieldset>
      <legend>Tamaño de texto</legend>
      <label><input name="texto" type="radio" value="normal"> Normal</label>
      <label><input name="texto" type="radio" value="grande"> Grande</label>
      <label><input name="texto" type="radio" value="muy-grande"> Muy grande</label>
    </fieldset>
    <label><input id="opcion-movimiento" type="checkbox"> Reducir animaciones</label>
  </section>

  <div class="app">
    <nav class="menu" aria-label="Módulos">
      <p class="marca">SPEAL</p>

      <a href="#/clientes" data-modulo="clientes">
        <span class="ic ic-clientes"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 14c0-3 2.2-5 5-5s5 2 5 5"/></svg></span>
        <span class="lbl">Clientes</span>
      </a>
      <a href="#/proyectos" data-modulo="proyectos">
        <span class="ic ic-proyectos"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.3h4.2l1.3 1.6H14V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5.3Z"/></svg></span>
        <span class="lbl">Proyectos</span>
      </a>
      <a href="#/cotizaciones" data-modulo="cotizaciones">
        <span class="ic ic-cotizaciones"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="2" width="9" height="12" rx="1.3"/><path d="M6 6h4M6 8.5h4M6 11h2.5"/></svg></span>
        <span class="lbl">Cotizaciones</span>
      </a>
      <a href="#/proveedores" data-modulo="proveedores">
        <span class="ic ic-proveedores"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4.5h7V11h-7Z"/><path d="M8.5 7h3l1.5 2v2h-4.5Z"/><circle cx="4" cy="12.3" r="1.1"/><circle cx="11" cy="12.3" r="1.1"/></svg></span>
        <span class="lbl">Proveedores</span>
      </a>
      <a href="#/requisiciones" data-modulo="requisiciones">
        <span class="ic ic-requisiciones"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2.6" width="10" height="11" rx="1.3"/><path d="M6 2h4v1.5H6Z"/><path d="M5.5 8.3 7.1 9.9 10.5 6.4"/></svg></span>
        <span class="lbl">Requisiciones</span>
      </a>
      <a href="#/ordenes-compra" data-modulo="ordenes-compra">
        <span class="ic ic-ordenes-compra"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="13.2" r="1"/><circle cx="11" cy="13.2" r="1"/><path d="M1.5 2.3h2l1.4 7.8h7.6l1.5-5.8H4.6"/></svg></span>
        <span class="lbl">Órdenes de compra</span>
      </a>
      <a href="#/expedientes-diseno" data-modulo="expedientes-diseno">
        <span class="ic ic-expedientes-diseno"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13.5 12.5 2.5"/><path d="M5.3 5.2l1.7 1.7M8.1 8.4l1.7 1.7"/></svg></span>
        <span class="lbl">Expedientes de diseño</span>
      </a>
      <a href="#/reportes-servicio" data-modulo="reportes-servicio">
        <span class="ic ic-reportes-servicio"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 2.4a3 3 0 0 0-4 4.1L2.3 9.8l2 2 3.3-3.4a3 3 0 0 0 4.1-4l-1.5 1.5-1.8-.4-.4-1.8Z"/></svg></span>
        <span class="lbl">Reportes de servicio</span>
      </a>
      <a href="#/actas-entrega" data-modulo="actas-entrega">
        <span class="ic ic-actas-entrega"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.2" width="11" height="7" rx="1.1"/><path d="M2.5 6.2 8 3l5.5 3.2"/><path d="M8 8.5v3.2"/></svg></span>
        <span class="lbl">Actas de entrega</span>
      </a>
      <a href="#/actas-cierre" data-modulo="actas-cierre">
        <span class="ic ic-actas-cierre"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2 13 3.8v3.8c0 3.3-2.2 5.3-5 6.2-2.8-.9-5-2.9-5-6.2V3.8Z"/><path d="M5.7 8 7.3 9.6 10.3 6.3"/></svg></span>
        <span class="lbl">Actas de cierre</span>
      </a>
      <a href="#/usuarios" data-modulo="usuarios">
        <span class="ic ic-usuarios"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="9.5" rx="1.4"/><circle cx="6" cy="7" r="1.4"/><path d="M4.1 10.4c.3-1.1 1-1.6 1.9-1.6s1.6.5 1.9 1.6"/><path d="M9.6 6.4h3M9.6 8.4h3"/></svg></span>
        <span class="lbl">Usuarios</span>
      </a>

      <button id="btn-accesibilidad" class="acceso-boton" type="button" aria-expanded="false" aria-controls="panel-accesibilidad">Accesibilidad</button>
      <button id="cerrar-sesion" class="boton boton-secundario" type="button">Cerrar sesión</button>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="crumbs"><span>SPEAL /</span><span id="crumb-modulo">Inicio</span></div>
        <div class="campana-wrap">
          <button id="btn-notificaciones" class="campana-boton" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Notificaciones">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a3.5 3.5 0 0 0-3.5 3.5v2.3c0 .5-.2 1-.5 1.4L3 10.5h10l-1-1.3a2 2 0 0 1-.5-1.4V5.5A3.5 3.5 0 0 0 8 2Z"/><path d="M6.3 12.5a1.8 1.8 0 0 0 3.4 0"/></svg>
            <span id="campana-contador" class="campana-contador" hidden>0</span>
          </button>
          <div id="panel-notificaciones" class="panel-notificaciones oculto" aria-label="Notificaciones"></div>
        </div>
        <div class="topbar-usuario">
          <div class="avatar" id="topbar-avatar">--</div>
          <div>
            <b id="topbar-nombre">—</b>
            <span>Sesión activa</span>
          </div>
        </div>
      </header>

      <main class="contenido" id="contenido" tabindex="-1">
        <p class="subtitulo">Cargando…</p>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <script src="/js/inicio.js"></script>
</body>
</html>
