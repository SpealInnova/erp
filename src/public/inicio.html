<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPEAL Project Control</title>
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/tableros.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.css">
  <script src="/js/accesibilidad.js"></script>
</head>
<body class="app-body">
  <section id="panel-accesibilidad" class="acceso-panel oculto" aria-label="Opciones de accesibilidad">
    <label><input id="opcion-contraste" type="checkbox"> Alto contraste</label>
    <fieldset>
      <legend>Tamaño de texto</legend>
      <label><input name="texto" type="radio" value="normal"> Normal</label>
      <label><input name="texto" type="radio" value="grande"> Grande</label>
      <label><input name="texto" type="radio" value="muy-grande"> Muy grande</label>
    </fieldset>
    <label><input id="opcion-movimiento" type="checkbox"> Reducir animaciones</label>
  </section>

  <div class="app">
    <nav class="menu" aria-label="Módulos">
      <button id="btn-colapsar-menu" class="menu-colapsar-boton" type="button" aria-label="Contraer menú" aria-expanded="true">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <p class="marca">SPEAL</p>

      <!-- Módulos agrupados como en la propuesta de interfaz; las entidades de
           cada módulo se recorren con las pestañas horizontales (#subtabs). -->
      <div class="nav-section-label">Gerencia</div>
      <a href="#/tablero" data-modulo="tablero">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-dash" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#79A8FF"/><stop offset="1" stop-color="#2952CC"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-dash)"/><rect x="9" y="21" width="5" height="10" rx="1.6" fill="#fff" fill-opacity=".92"/><rect x="17.5" y="15" width="5" height="16" rx="1.6" fill="#fff" fill-opacity=".92"/><rect x="26" y="9" width="5" height="22" rx="1.6" fill="#fff" fill-opacity=".8"/></svg></span>
        <span class="lbl">Tablero gerencial</span>
      </a>

      <div class="nav-section-label">Operación</div>
      <a href="#/proyectos" data-modulo="proyectos">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-proy" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#A99BFF"/><stop offset="1" stop-color="#5B4FD1"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-proy)"/><rect x="9" y="8" width="18" height="24" rx="3" fill="#fff" fill-opacity=".28" transform="rotate(-7 18 20)"/><rect x="12" y="7" width="19" height="25" rx="3" fill="#fff" fill-opacity=".96"/><rect x="16" y="13" width="11" height="2.6" rx="1.3" fill="#5B4FD1"/><rect x="16" y="18" width="11" height="2.6" rx="1.3" fill="#5B4FD1" fill-opacity=".65"/><rect x="16" y="23" width="7" height="2.6" rx="1.3" fill="#5B4FD1" fill-opacity=".4"/></svg></span>
        <span class="lbl">Proyectos</span>
      </a>
      <a href="#/comercial" data-modulo="comercial">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-com" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF9CBC"/><stop offset="1" stop-color="#D6467E"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-com)"/><circle cx="16" cy="19" r="8" fill="#fff" fill-opacity=".5"/><circle cx="25" cy="22" r="8" fill="#fff" fill-opacity=".95"/></svg></span>
        <span class="lbl">Comercial</span>
      </a>
      <a href="#/expedientes-diseno" data-modulo="diseno">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-dis" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFAE8A"/><stop offset="1" stop-color="#D9542B"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-dis)"/><path d="M11 31 20 10l9 21" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10" r="3.4" fill="#fff"/><path d="M14 25h12" stroke="#fff" stroke-opacity=".6" stroke-width="2.6" stroke-linecap="round"/></svg></span>
        <span class="lbl">Diseño I+D+I</span>
      </a>
      <a href="#/compras" data-modulo="compras">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-comp" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FDC26B"/><stop offset="1" stop-color="#C9770F"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-comp)"/><rect x="9" y="15" width="22" height="16" rx="3" fill="#fff" fill-opacity=".96"/><path d="M9 15l11-7 11 7" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.6" stroke-linejoin="round"/><rect x="18.5" y="15" width="3" height="16" fill="#C9770F" fill-opacity=".5"/></svg></span>
        <span class="lbl">Compras</span>
      </a>
      <a href="#/reportes-servicio" data-modulo="soporte">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-sop" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#59D8E6"/><stop offset="1" stop-color="#0E93A3"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-sop)"/><path d="M20 8l10 4v8c0 7-4.5 11-10 13-5.5-2-10-6-10-13v-8z" fill="#fff" fill-opacity=".95"/><path d="M15.3 20.6l3 3 6.4-6.8" stroke="#0E93A3" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
        <span class="lbl">Soporte técnico</span>
      </a>
      <a href="#/actas-entrega" data-modulo="entregas">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-ent" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5BDBA7"/><stop offset="1" stop-color="#12875A"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-ent)"/><path d="M9 15l4-6h14l4 6" fill="#fff" fill-opacity=".55"/><rect x="9" y="15" width="22" height="16" rx="3" fill="#fff" fill-opacity=".97"/><path d="M15.5 23l3 3 6-6" stroke="#12875A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
        <span class="lbl">Entregas y cierre</span>
      </a>

      <div class="nav-section-label">Control</div>
      <a href="#/usuarios" data-modulo="usuarios">
        <span class="ic ic-svg" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="mi-aud" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8C9BD1"/><stop offset="1" stop-color="#414F7A"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" fill="url(#mi-aud)"/><rect x="8" y="7" width="16" height="23" rx="3" fill="#fff" fill-opacity=".9"/><rect x="11" y="12" width="10" height="2" rx="1" fill="#414F7A" fill-opacity=".55"/><rect x="11" y="16" width="7" height="2" rx="1" fill="#414F7A" fill-opacity=".4"/><circle cx="26" cy="25" r="9" fill="#fff" fill-opacity=".98"/><path d="M26 20.5V25l3 2" stroke="#414F7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></span>
        <span class="lbl">Usuarios</span>
      </a>

      <button id="btn-accesibilidad" class="acceso-boton" type="button" aria-expanded="false" aria-controls="panel-accesibilidad">Accesibilidad</button>
      <button id="cerrar-sesion" class="boton boton-secundario" type="button">Cerrar sesión</button>
    </nav>

    <div class="main">
      <header class="topbar">
        <div class="crumbs"><span>SPEAL /</span><span id="crumb-modulo">Inicio</span></div>
        <div class="campana-wrap">
          <button id="btn-notificaciones" class="campana-boton" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Notificaciones">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a3.5 3.5 0 0 0-3.5 3.5v2.3c0 .5-.2 1-.5 1.4L3 10.5h10l-1-1.3a2 2 0 0 1-.5-1.4V5.5A3.5 3.5 0 0 0 8 2Z"/><path d="M6.3 12.5a1.8 1.8 0 0 0 3.4 0"/></svg>
            <span id="campana-contador" class="campana-contador" hidden>0</span>
          </button>
          <div id="panel-notificaciones" class="panel-notificaciones oculto" aria-label="Notificaciones"></div>
        </div>
        <div class="topbar-usuario">
          <div class="avatar" id="topbar-avatar">--</div>
          <div>
            <b id="topbar-nombre">—</b>
            <span>Sesión activa</span>
          </div>
        </div>
      </header>

      <nav id="subtabs" class="subtabs" aria-label="Secciones del módulo" hidden></nav>
      <main class="contenido" id="contenido" tabindex="-1">
        <p class="subtitulo">Cargando…</p>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <script src="/js/tableros.js"></script>
  <script src="/js/listados.js"></script>
  <script src="/js/inicio.js"></script>
</body>
</html>
